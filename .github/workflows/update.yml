name: 데이터 갱신

# 원티드와 THE VC가 GitHub 클라우드 IP를 차단해서 기본 스케줄은 꺼둠.
# 맥을 self-hosted runner로 등록하고 저장소 변수 RUNNER_LABEL=self-hosted 를 넣으면 아래 schedule 주석을 풀어 쓰면 됨.
on:
  # schedule:
  #   - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/update.mjs
      - name: 커밋
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "data: $(date -u -d '+9 hour' '+%Y-%m-%d') 갱신"
          git push
