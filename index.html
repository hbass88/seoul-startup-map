<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울 스타트업 지도</title>
<meta name="description" content="서울 투자유치 스타트업의 위치, 채용공고, 인원 변화, 연봉, 매출, 투자단계를 지도 한 장에서.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <h1>서울 스타트업 지도</h1>
    <span class="meta" id="meta">불러오는 중</span>
  </div>
  <div class="seg" role="group" aria-label="히트맵 기준">
    <button data-heat="jobs" class="on">채용</button>
    <button data-heat="emp">인원</button>
    <button data-heat="growth">순증</button>
    <button data-heat="none">끄기</button>
  </div>
</header>

<nav class="roles" id="roles" aria-label="직무"></nav>

<main class="layout">
  <aside class="side" id="side">
    <div class="filters">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="회사, 공고, 대표자 검색" autocomplete="off">
      </div>
      <div class="row">
        <select id="f-stage"><option value="">투자단계</option></select>
        <select id="f-size">
          <option value="">인원</option>
          <option value="0-50">50명 이하</option>
          <option value="51-300">51~300명</option>
          <option value="301-100000">301명 이상</option>
        </select>
        <select id="f-dist"><option value="">지역</option></select>
      </div>
      <div class="row">
        <select id="f-ind"><option value="">업종</option></select>
      </div>
      <div class="chips">
        <label><input type="checkbox" id="f-hiring" checked><span>채용중</span></label>
        <label><input type="checkbox" id="f-fulltime"><span>정규직</span></label>
        <label><input type="checkbox" id="f-foreign"><span>외국계</span></label>
        <label><input type="checkbox" id="f-growing"><span>인원 증가</span></label>
      </div>
      <div class="row between">
        <span class="count" id="count"></span>
        <select id="sort" class="ghost">
          <option value="jobs">공고 많은 순</option>
          <option value="recent">최근 공고 순</option>
          <option value="emp">인원 많은 순</option>
          <option value="growth">순증 많은 순</option>
          <option value="salary">평균연봉 순</option>
          <option value="sales">매출 순</option>
          <option value="founded">최근 설립 순</option>
        </select>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </aside>

  <section class="mapwrap">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <button class="list-toggle" id="listToggle">목록</button>
  </section>

  <aside class="detail" id="detail" aria-hidden="true">
    <button class="close" id="closeDetail" aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="detailBody"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="app.js"></script>
</body>
</html>
